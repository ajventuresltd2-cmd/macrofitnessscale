<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroFitnessScale</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section class="welcome-screen">

      <div class="logo">MACROFITNESSSCALE</div>

      <p class="categories">Fitness • Nutrition • Mindset • Growth</p>

      <div class="hero">
        <h1>Measure Your Progress.<br>Transform Your Life.</h1>

        <p>
          Your personalized journey to better fitness,
          healthier habits, and lasting personal growth.
        </p>
      </div>

      <button class="primary-button" onclick="startApp()">
        GET STARTED
      </button>

      <p class="login-text">
        Already have an account?
        <button class="text-button" onclick="login()">Log in</button>
      </p>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
